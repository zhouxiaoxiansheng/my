server {
    listen 80;
    listen [::]:80;
    server_name xiaoaivip.top www.xiaoaivip.top;

    # 若已配置 HTTPS，取消下面注释并指向证书路径
    # return 301 https://$host$request_uri;

    root /var/www/xiaoaivip.top;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}

